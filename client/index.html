<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07111f" />
  <meta
    name="description"
    content="Search current weather and a five-day forecast by city."
  />
  <link
    rel="stylesheet"
    href="https://use.fontawesome.com/releases/v5.3.1/css/all.css"
    integrity="sha384-mzrmE5qonljUremFsqc01SB46JvROS7bZs3IO2EmfFsd15uHvIt+Y8vEf7N7fWAU"
    crossorigin="anonymous"
  />
  <title>Weather Dashboard</title>
</head>

<body>
  <header class="container-fluid text-center text-white p-1 weather-header">
    <h1>Weather Dashboard</h1>
  </header>

  <main class="container-fluid">
    <div class="row">
      <aside class="col-lg-3 pb-3">
        <h2 id="form-heading">Search for a city</h2>

        <form id="search-form" class="form">
          <div class="form-group">
            <div class="input-group">
              <input
                class="weather-search"
                type="search"
                id="search-input"
                placeholder="Howell, MI"
                autocomplete="off"
                aria-labelledby="form-heading"
                aria-describedby="search-feedback"
                aria-controls="today forecast"
              />
              <button
                type="submit"
                class="btn search-button"
                id="search-button"
                aria-label="Search weather"
              >
                Search
              </button>
              <hr class="weather-hr" />
            </div>
          </div>
        </form>

        <p id="search-feedback" role="status" aria-live="polite"></p>
        <div class="row mt-2" id="history" aria-label="Recent searches"></div>
      </aside>

      <div class="col-lg-9 pb-3">
        <section class="mt-3" aria-labelledby="search-title" aria-live="polite">
          <div class="card">
            <div class="card-body" id="today">
              <h2 class="card-title" id="search-title">
                Search for a city
                <img id="weather-img" class="weather-img" alt="" />
              </h2>
              <p class="card-text" id="temp">Temperature: --</p>
              <p class="card-text" id="wind">Wind: --</p>
              <p class="card-text" id="humidity">Humidity: --</p>
            </div>
          </div>
        </section>

        <section
          id="forecast"
          class="row mt-3"
          aria-label="Five-day forecast"
          aria-live="polite"
        ></section>
      </div>
    </div>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
